      <!-- 原型舞台：iframe 在上层，兜底提示垫在下层 -->

      </div>

      <!-- 兜底卡片：JS 判定 iframe 加载失败后显示 -->
      <div class="prototype-stage prototype-fallback reveal" id="protoFallback" hidden>
        <h3>原型未能内嵌显示</h3>
        <p>内嵌副本加载异常。原型本身完全正常，直接在新窗口打开即可获得与网页版一致的交互体验。</p>
        <a href="https://pm-cloud-phase3.vercel.app/cloud" target="_blank" rel="noopener" class="back-btn">在新窗口打开原型 ↗</a>
      </div>

      <div class="prototype-open reveal">
        <a href="https://pm-cloud-phase3.vercel.app/cloud" target="_blank" rel="noopener" class="back-btn">在新窗口打开原型 ↗</a>

  <script>
    // iframe 可见性兜底：被 X-Frame-Options 拦截时，浏览器不会把错误抛给父页面，
    // 因此用超时兜底——9 秒内确认不了内容窗口，就把空白舞台换成可点击的兜底卡片。
    (function () {
      'use strict';
      var frame = document.getElementById('protoFrame');
      var stage = document.getElementById('protoStage');
      var fallback = document.getElementById('protoFallback');
      if (!frame || !stage || !fallback) return;

      var ok = false;

      function markReady() {
        window.clearTimeout(timer);
        var hint = stage.querySelector('.prototype-hint');
        if (hint) hint.style.display = 'none';
        stage.dataset.state = 'ready';
      }

      // 整页自适应高度：iframe 与原型同源，可直接量测内容真实高度，
      // 把 iframe 撑到和内容一样高 → 原型无内部滚动条，跟随外层页面自然滚动。
      // 隐藏原型内部滚动条（iframe 与主站同源，可直接注入样式）：
      // 视觉上完全不出现滚动条；同时保留滚动能力作为极端情况兜底。
      function hideInnerScrollbar() {
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.head || doc.getElementById('noSbStyle')) return;
          var st = doc.createElement('style');
          st.id = 'noSbStyle';
          st.textContent =
            'html{scrollbar-width:none!important;-ms-overflow-style:none!important}' +
            'html::-webkit-scrollbar,body::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}';
          doc.head.appendChild(st);
        } catch (e) { /* 跨域时跳过 */ }
      }

      function fitHeight() {
        try {
          var doc = frame.contentDocument;
          if (!doc || !doc.documentElement) return;
          hideInnerScrollbar();
          var de = doc.documentElement;
          var h = Math.max(
            de.scrollHeight,
            de.offsetHeight,
            de.getBoundingClientRect().height,
            doc.body ? doc.body.scrollHeight : 0
          );
          if (h > 200) {
            frame.style.maxHeight = 'none';
            frame.style.height = (h + 1) + 'px'; // +1 抵消取整误差，避免触发滚动条
          }
        } catch (e) { /* 跨域时量测不到，保持固定高度 */ }
      }

      frame.addEventListener('load', function () {
        try {
          // 读到 about:blank 说明当前是浏览器错误页/占位页，视为未加载成功
          var href = frame.contentWindow.location.href;
          ok = href && href !== 'about:blank';
        } catch (e) {
          // 跨域但允许嵌套：读不到 href 属正常，视为成功
          ok = true;
        }
        if (ok) {
          markReady();
          fitHeight();
          // 字体/图片就位、场景切换都会改变内容高度：多次补偿 + 监听尺寸变化
          [300, 800, 2000, 4000].forEach(function (d) { setTimeout(fitHeight, d); });
          try {
            new ResizeObserver(fitHeight).observe(frame.contentDocument.documentElement);
          } catch (e) { /* 老浏览器降级为定时补偿 */ }
        }
      });

      // 9 秒仍未确认加载 → 隐藏舞台，显示兜底卡片
      var timer = window.setTimeout(function () {
        if (ok) return;
        stage.style.display = 'none';
        fallback.hidden = false;
      }, 9000);
    })();
  </script>
